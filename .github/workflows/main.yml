name: MYSTERY VERSE - Episode 002 Elisa Lam

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "input/elisa_lam.txt"
      - "src/config.py"
      - "src/audio/edge_tts_provider.py"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check engine
        run: python -m src.main doctor

      - name: Render Indonesian documentary - Elisa Lam
        env:
          VIDEO_PROVIDER: stock
          EDGE_TTS_VOICE: id-ID-ArdiNeural
          EDGE_TTS_RATE: "-10%"
          SUBTITLE_FONT: DejaVu Sans
          SUBTITLE_FONT_SIZE: "30"
          SUBTITLE_COLOR: FFD700
          SUBTITLE_OUTLINE_COLOR: "000000"
          SUBTITLE_OUTLINE_WIDTH: "3"
          LOG_LEVEL: INFO
        run: |
          python -m src.main generate input/elisa_lam.txt \
            -o output/elisa-lam \
            --tts edge \
            --video stock \
            --language id \
            --subtitles

      - name: Verify MP4
        run: |
          test -s output/elisa-lam/final_video.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 output/elisa-lam/final_video.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystery-verse-episode-002-elisa-lam
          path: output/elisa-lam/final_video.mp4
          if-no-files-found: error
          retention-days: 7
